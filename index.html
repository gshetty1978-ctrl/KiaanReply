<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115">
<title>KiaanReply</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#1f2430; --line:#2a2f3a; --text:#e6e9ef;
    --muted:#96a0b5; --accent:#2f6e62; --accent2:#4fb6a3; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column}

  #gate{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{max-width:320px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
  .gate-card h2{margin:0;font-size:1.3rem}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:1rem}
  input:focus{outline:2px solid var(--accent2)}
  button{padding:12px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:hover{background:var(--accent2)}
  #gateError{color:var(--bad);font-size:0.85rem;min-height:1.1em}

  #app{flex:1;display:none;min-height:0}
  .layout{flex:1;display:flex;min-height:0;height:100%}
  #list{width:260px;flex-shrink:0;border-right:1px solid var(--line);overflow-y:auto}
  .conv{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv:hover, .conv.active{background:var(--panel2)}
  .conv .name{font-weight:600;font-size:0.92rem}
  .conv .preview{color:var(--muted);font-size:0.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
  #listEmpty{color:var(--muted);padding:20px;font-size:0.88rem;text-align:center}

  #thread{flex:1;display:flex;flex-direction:column;min-width:0}
  #threadHead{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #deleteChat{padding:6px 12px;font-size:0.82rem;font-weight:600;background:var(--bad);flex-shrink:0}
  #deleteChat:hover{background:#f87171}
  #threadMsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg-row{display:flex;flex-direction:column;max-width:72%}
  .msg-row.me{align-self:flex-end;align-items:flex-end}
  .msg-row.them{align-self:flex-start;align-items:flex-start}
  .msg{padding:9px 13px;border-radius:14px;font-size:0.94rem;line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .msg-row.me .msg{background:var(--accent);border-bottom-right-radius:4px}
  .msg-row.them .msg{background:var(--panel2);border-bottom-left-radius:4px}
  .msg-foot{display:flex;align-items:center;gap:8px;margin-top:3px;padding:0 4px}
  .msg-time{font-size:0.72rem;color:var(--muted)}
  .msg-time.edited::after{content:" · edited"}
  .msg-actions{display:none;gap:6px}
  .msg-row.me:hover .msg-actions{display:flex}
  .msg-actions button{background:none;border:none;color:var(--muted);font-size:0.72rem;padding:0;cursor:pointer;font-weight:400}
  .msg-actions button:hover{color:var(--text);background:none;text-decoration:underline}
  .msg-edit-input{width:100%;padding:7px 11px;border-radius:12px;border:1px solid var(--accent2);background:var(--panel);color:var(--text);font-size:0.94rem}
  #noSelect{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  #replyBox{display:none;gap:8px;padding:12px;border-top:1px solid var(--line);padding-bottom:max(12px, env(safe-area-inset-bottom, 0px))}
  #replyBox input{flex:1}

  #notifyBanner{display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:0.85rem}
  #notifyBanner button{padding:7px 12px;font-size:0.85rem}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h2>KiaanReply</h2>
    <input id="pinInput" type="password" placeholder="PIN" autocomplete="off">
    <button id="pinBtn" type="button">Unlock</button>
    <p id="gateError"></p>
  </div>
</div>

<div id="app">
  <div id="notifyBanner">
    <span>Turn on notifications for new messages?</span>
    <button id="notifyBtn" type="button">Enable</button>
  </div>
  <div class="layout">
    <div id="list"><p id="listEmpty">No conversations yet.</p></div>
    <div id="thread">
      <div id="noSelect">Pick a conversation on the left.</div>
    </div>
  </div>
</div>

<script src="https://kiaanchat.onrender.com/socket.io/socket.io.js"></script>
<script>
  var CHAT_ORIGIN = 'https://kiaanchat.onrender.com';
  (function(){
    var socket = io(CHAT_ORIGIN);
    var gateEl = document.getElementById('gate');
    var appEl = document.getElementById('app');
    var pinInput = document.getElementById('pinInput');
    var pinBtn = document.getElementById('pinBtn');
    var gateError = document.getElementById('gateError');
    var listEl = document.getElementById('list');
    var listEmpty = document.getElementById('listEmpty');
    var threadEl = document.getElementById('thread');
    var notifyBanner = document.getElementById('notifyBanner');
    var notifyBtn = document.getElementById('notifyBtn');

    var conversations = {};
    var activeId = null;
    var currentToken = null;

    function saveToken(t){ try { localStorage.setItem('kr_owner_token', t); } catch(e) {} }
    function getToken(){ try { return localStorage.getItem('kr_owner_token'); } catch(e) { return null; } }

    function tryAuth(token){
      currentToken = token;
      socket.emit('owner:auth', { token: token });
    }

    socket.on('connect', function(){
      var token = getToken();
      if (token) tryAuth(token);
    });

    socket.on('owner:authResult', function(res){
      if (res.ok){
        gateEl.style.display = 'none';
        appEl.style.display = 'block';
        maybeShowNotifyBanner();
      } else {
        gateEl.style.display = 'flex';
        appEl.style.display = 'none';
        try { localStorage.removeItem('kr_owner_token'); } catch(e) {}
      }
    });

    pinBtn.addEventListener('click', function(){
      var pin = pinInput.value;
      if (!pin) return;
      gateError.textContent = '';
      fetch(CHAT_ORIGIN + '/api/owner/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pin })
      }).then(function(r){ return r.json(); }).then(function(data){
        if (data.ok){
          saveToken(data.token);
          tryAuth(data.token);
        } else {
          gateError.textContent = data.error || 'Wrong PIN.';
        }
      }).catch(function(){
        gateError.textContent = 'Could not reach the server.';
      });
    });
    pinInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') pinBtn.click(); });

    function formatTime(ts){
      var d = new Date(ts);
      var sameDay = d.toDateString() === new Date().toDateString();
      var time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      if (sameDay) return time;
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + time;
    }

    function renderList(){
      var ids = Object.keys(conversations).sort(function(a, b){
        return conversations[b].updatedAt - conversations[a].updatedAt;
      });
      if (!ids.length){
        listEl.innerHTML = '';
        listEl.appendChild(listEmpty);
        return;
      }
      listEl.innerHTML = '';
      ids.forEach(function(id){
        var c = conversations[id];
        var last = c.messages[c.messages.length - 1];
        var div = document.createElement('div');
        div.className = 'conv' + (id === activeId ? ' active' : '');
        div.innerHTML = '<div class="name"></div><div class="preview"></div>';
        div.querySelector('.name').textContent = c.name || 'Someone';
        div.querySelector('.preview').textContent = last ? last.text : 'No messages yet';
        div.addEventListener('click', function(){ openConversation(id); });
        listEl.appendChild(div);
      });
    }

    function openConversation(id){
      activeId = id;
      renderList();
      socket.emit('owner:open', { conversationId: id });
    }

    function renderThread(convo){
      threadEl.innerHTML =
        '<div id="threadHead"><span id="threadName"></span><button id="deleteChat" type="button">Delete chat</button></div>' +
        '<div id="threadMsgs"></div>' +
        '<form id="replyBox" style="display:flex">' +
        '<input id="replyInput" type="text" placeholder="Reply…" maxlength="2000" autocomplete="off">' +
        '<button type="submit">Send</button>' +
        '</form>';
      document.getElementById('threadName').textContent = convo.name || 'Someone';
      document.getElementById('deleteChat').addEventListener('click', function(){
        if (!confirm('Delete this whole chat with ' + (convo.name || 'this person') + '? This can\'t be undone.')) return;
        socket.emit('owner:delete', { conversationId: convo.id });
      });
      var msgsEl = document.getElementById('threadMsgs');
      convo.messages.forEach(function(msg){
        var row = document.createElement('div');
        row.className = 'msg-row ' + (msg.from === 'owner' ? 'me' : 'them');
        var bubble = document.createElement('div');
        bubble.className = 'msg';
        bubble.textContent = msg.text;
        var foot = document.createElement('div');
        foot.className = 'msg-foot';
        var time = document.createElement('span');
        time.className = 'msg-time' + (msg.editedAt ? ' edited' : '');
        time.textContent = formatTime(msg.at);
        foot.appendChild(time);

        if (msg.from === 'owner'){
          var actions = document.createElement('span');
          actions.className = 'msg-actions';
          var editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', function(){
            var input = document.createElement('input');
            input.className = 'msg-edit-input';
            input.type = 'text';
            input.maxLength = 2000;
            input.value = msg.text;
            bubble.replaceWith(input);
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            var done = false, cancelled = false;
            function finish(){
              if (done) return;
              done = true;
              var newText = input.value.trim();
              input.replaceWith(bubble);
              if (!cancelled && newText && newText !== msg.text){
                socket.emit('owner:editMessage', { conversationId: convo.id, messageId: msg.id, text: newText });
              }
            }
            input.addEventListener('keydown', function(e){
              if (e.key === 'Enter'){ e.preventDefault(); input.blur(); }
              else if (e.key === 'Escape'){ cancelled = true; input.blur(); }
            });
            input.addEventListener('blur', finish);
          });
          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', function(){
            if (!confirm('Delete this message?')) return;
            socket.emit('owner:deleteMessage', { conversationId: convo.id, messageId: msg.id });
          });
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          foot.appendChild(actions);
        }

        row.appendChild(bubble);
        row.appendChild(foot);
        msgsEl.appendChild(row);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;

      var replyForm = document.getElementById('replyBox');
      var replyInput = document.getElementById('replyInput');
      replyForm.addEventListener('submit', function(e){
        e.preventDefault();
        var text = replyInput.value.trim();
        if (!text) return;
        socket.emit('owner:send', { conversationId: convo.id, text: text });
        replyInput.value = '';
      });
    }

    socket.on('owner:conversations', function(list){
      conversations = {};
      list.forEach(function(c){ conversations[c.id] = c; });
      renderList();
    });

    socket.on('owner:conversationUpdated', function(c){
      conversations[c.id] = c;
      renderList();
      if (c.id === activeId) renderThread(c);
    });

    socket.on('owner:history', function(convo){
      conversations[convo.id] = convo;
      renderThread(convo);
    });

    socket.on('owner:conversationDeleted', function(data){
      delete conversations[data.id];
      if (activeId === data.id){
        activeId = null;
        threadEl.innerHTML = '<div id="noSelect">Pick a conversation on the left.</div>';
      }
      renderList();
    });

    /* ---- PWA install + push notifications ---- */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }

    function urlBase64ToUint8Array(base64String){
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      var raw = atob(base64);
      var out = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }

    function maybeShowNotifyBanner(){
      if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (Notification.permission === 'granted') {
        subscribeToPush();
        return;
      }
      if (Notification.permission === 'denied') return;
      notifyBanner.style.display = 'flex';
    }

    function subscribeToPush(){
      navigator.serviceWorker.ready.then(function(reg){
        return fetch(CHAT_ORIGIN + '/api/vapid-public-key').then(function(r){ return r.json(); }).then(function(data){
          if (!data.key) return;
          return reg.pushManager.getSubscription().then(function(existing){
            if (existing) return existing;
            return reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(data.key)
            });
          });
        });
      }).then(function(sub){
        if (!sub || !currentToken) return;
        return fetch(CHAT_ORIGIN + '/api/owner/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: currentToken, subscription: sub })
        });
      }).catch(function(){});
    }

    notifyBtn.addEventListener('click', function(){
      Notification.requestPermission().then(function(perm){
        notifyBanner.style.display = 'none';
        if (perm === 'granted') subscribeToPush();
      });
    });
  })();
</script>
</body>
</html>
